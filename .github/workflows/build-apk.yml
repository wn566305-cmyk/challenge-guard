name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp index.html www/index.html
          npx cap init "Challenge Guard" com.challengeguard.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          fore = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for d, s in legacy.items():
              p = res + '/mipmap-' + d
              if os.path.isdir(p):
                  im = src.resize((s, s), Image.LANCZOS)
                  im.save(p + '/ic_launcher.png')
                  im.save(p + '/ic_launcher_round.png')
                  src.resize((fore[d], fore[d]), Image.LANCZOS).save(p + '/ic_launcher_foreground.png')
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: challenge-guard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
